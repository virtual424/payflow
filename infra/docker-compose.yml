name: payflow

services:

  # ---------- POSTGRES ---------


  postgres:
    image: postgres:17
    container_name: payflow-postgres
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payflow" ]
      interval: 5s
      timeout: 3s
      retries: 10


  # ---------- Redis ----------
  redis:
    image: redis:7.4
    container_name: payflow-redis
    command: [ "redis-server", "--appendonly", "yes" ] # AOF persistence
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:   # GUI to browse keys, run commands, watch TTLs
    image: redis/redisinsight:latest
    container_name: payflow-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis


# ---------- Kafka (KRaft, single node) ----------


  # ---------- Kafka (KRaft, single node) ----------
  kafka:
    image: apache/kafka:4.1.0
    container_name: payflow-kafka
    ports:
      - "9094:9094" # only the EXTERNAL listener is exposed to the host
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # KRaft: this node is both
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # single broker -> RF must be 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created explicitly by our apps
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
      localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: payflow-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: payflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092 # container-to-container -> service name
    depends_on:
      kafka:
        condition: service_healthy


  # ---------- Tracing ----------

  zipkin:
    image: openzipkin/zipkin:3
    container_name: payflow-zipkin
    ports:
      - "9411:9411"

volumes:
  pg-data:
  redis-data:
  kafka-data:
